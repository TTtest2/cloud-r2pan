<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cloud-r2pan</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px 24px 76px; color: #1d2433; position: relative;
  background: #f5f6f8;
  -webkit-tap-highlight-color: transparent;
}
.orb { display: none; position: fixed; border-radius: 50%; filter: blur(90px); opacity: .5; pointer-events: none; animation: drift 18s ease-in-out infinite alternate; }
.o1 { width: 46vmax; height: 46vmax; background: #38bdf8; top: -18%; left: -14%; }
.o2 { width: 40vmax; height: 40vmax; background: #8b5cf6; bottom: -20%; right: -10%; animation-delay: -6s; }
.o3 { width: 30vmax; height: 30vmax; background: #ec4899; top: 55%; left: 8%; animation-delay: -12s; opacity: .35; }
@keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(6vw, -5vh) scale(1.12); } }

.card {
  position: relative; width: 100%; max-width: 440px; margin: auto;
  padding: 48px 36px 40px; border-radius: 36px; text-align: center;
  background: #ffffff;
  border: 1px solid rgba(24,34,58,.10);
  box-shadow: 0 16px 40px rgba(24,34,58,.10);
  animation: rise .65s cubic-bezier(.22,1.2,.36,1) both;
}
@keyframes rise { from { opacity: 0; transform: translateY(28px) scale(.95); } to { opacity: 1; transform: none; } }

.file-icon {
  width: 104px; height: 104px; margin: 0 auto 24px; border-radius: 30px;
  display: flex; align-items: center; justify-content: center;
  background: #eef1f5;
  border: 1px solid rgba(24,34,58,.10);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.9), 0 10px 26px rgba(24,34,58,.08);
  position: relative; overflow: hidden;
}
.file-icon::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.6) 48%, transparent 62%);
  transform: translateX(-120%); animation: shine 4.5s ease-in-out infinite;
}
@keyframes shine { 0%, 60% { transform: translateX(-120%); } 85%, 100% { transform: translateX(120%); } }
.file-icon .ext { font-size: 26px; font-weight: 800; letter-spacing: -.02em; text-shadow: 0 1px 0 rgba(255,255,255,.8); }

h1 { font-size: 21px; font-weight: 700; letter-spacing: -.02em; word-break: break-all; line-height: 1.35; }
.meta { margin-top: 10px; font-size: 14px; color: rgba(29,36,51,.62); display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
.meta .dot { width: 3px; height: 3px; border-radius: 50%; background: rgba(29,36,51,.28); }

.stats { display: flex; gap: 10px; margin-top: 26px; }
.stat {
  flex: 1; padding: 14px 8px; border-radius: 20px;
  background: #eef1f5; border: 1px solid rgba(24,34,58,.10);
}
.stat .v { font-size: 20px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat .k { margin-top: 3px; font-size: 12px; color: rgba(29,36,51,.62); }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; margin-top: 28px; padding: 17px; border: none; border-radius: 22px;
  font-size: 17px; font-weight: 650; letter-spacing: -.01em; color: #fff; cursor: pointer;
  background: linear-gradient(180deg, #5b9cf5, #2f6fed);
  box-shadow: 0 12px 30px rgba(47,111,237,.28), inset 0 1px 0 rgba(255,255,255,.22);
  transition: transform .15s cubic-bezier(.22,1.2,.36,1), box-shadow .2s;
  text-decoration: none; -webkit-user-select: none; user-select: none;
}
.btn:hover { transform: translateY(-1px) scale(1.01); }
.btn:active { transform: scale(.97); }
.btn svg { width: 19px; height: 19px; }

.hint { margin-top: 14px; font-size: 12.5px; color: rgba(29,36,51,.45); line-height: 1.6; }

.warn { margin-top: 18px; padding: 13px 16px; border-radius: 16px; font-size: 13.5px; line-height: 1.55;
  background: rgba(255,159,10,.10); border: 1px solid rgba(180,83,9,.24); color: #b45309; }

.loading { padding: 80px 0; text-align: center; }
.spinner { width: 34px; height: 34px; margin: 0 auto 16px; border-radius: 50%;
  border: 3px solid rgba(29,36,51,.15); border-top-color: #1d2433; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.brand { position: fixed; bottom: max(22px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
  font-size: 13px; color: rgba(29,36,51,.45); letter-spacing: .08em; }
.brand b { font-weight: 650; }
.lang-btn { margin-left: 10px; padding: 4px 13px; border-radius: 11px; border: 1px solid rgba(24,34,58,.12);
  background: #ffffff; color: #1d2433; font-size: 12px; font-family: inherit;
  letter-spacing: 0; cursor: pointer; box-shadow: 0 2px 8px rgba(24,34,58,.06);
  transition: all .2s; vertical-align: 1px; }
.lang-btn:hover { background: #eef1f5; color: #1d2433; }

/* GitHub Octocat 悬浮按钮 */
.octo-float {
  position: fixed;
  right: max(16px, env(safe-area-inset-right));
  bottom: max(20px, env(safe-area-inset-bottom));
  width: 44px; height: 44px;
  border-radius: 50%;
  background: #ffffff;
  border: 1px solid rgba(24,34,58,.10);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; text-decoration: none; z-index: 50;
  box-shadow: 0 8px 22px rgba(24,34,58,.12);
  transition: transform .25s cubic-bezier(.22,1.2,.36,1), box-shadow .25s;
}
.octo-float:hover { transform: translateY(-3px) scale(1.08); box-shadow: 0 12px 30px rgba(24,34,58,.18); }
.octo-float svg { width: 22px; height: 22px; color: #1d2433; }

.pw { margin-top: 6px; }
.pw input {
  width: 100%; margin-top: 22px; padding: 16px; border-radius: 16px; text-align: center;
  font-size: 17px; font-family: inherit; color: #1d2433; outline: none;
  background: #eef1f5; border: 1px solid rgba(24,34,58,.10);
}
.pw input::placeholder { color: rgba(29,36,51,.45); }
.pw input:focus { border-color: #2f6fed; }
.pw .err { margin-top: 10px; font-size: 13px; color: #dc2626; min-height: 18px; }
.pw .pw-hint { margin-top: 12px; font-size: 12.5px; color: rgba(29,36,51,.45); }
.pw.shake input { animation: shake .5s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }

/* Turnstile */
.ts-wrap {
  width: 100%; margin-top: 22px; display: flex; justify-content: center;
}
.ts-wrap div, .ts-wrap iframe { border-radius: 14px !important; }
.ts-passed {
  width: 100%; margin-top: 22px; padding: 14px; border-radius: 16px;
  background: rgba(15,157,88,.10); border: 1px solid rgba(15,157,88,.26);
  color: #0f9d58; font-size: 14px; text-align: center; font-weight: 600;
}
.ts-blocked-title { margin-top: 22px; font-size: 14px; color: #b45309; font-weight: 600; }
.ts-blocked-hint { margin-top: 6px; font-size: 12.5px; color: rgba(29,36,51,.62); line-height: 1.6; }

/* ═══════ 激活码浮动按钮 ═══════ */
.code-float {
  position: fixed;
  top: max(16px, env(safe-area-inset-top));
  left: max(16px, env(safe-area-inset-left));
  width: 44px; height: 44px;
  border-radius: 50%;
  background: linear-gradient(180deg, #5b9cf5, #2f6fed);
  border: 1px solid rgba(47,111,237,.35);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 50;
  box-shadow: 0 8px 22px rgba(47,111,237,.26);
  transition: transform .25s cubic-bezier(.22,1.2,.36,1), box-shadow .25s;
}
.code-float.position-right {
  left: auto;
  right: max(16px, env(safe-area-inset-right));
}
.code-float:hover { transform: translateY(-3px) scale(1.08); box-shadow: 0 12px 30px rgba(47,111,237,.34); }
.code-float svg { width: 22px; height: 22px; color: #fff; }
.code-float .badge {
  position: absolute; top: -2px; right: -2px; width: 12px; height: 12px;
  border-radius: 50%; background: #0f9d58; border: 2px solid #ffffff;
}

/* ═══════ 激活码弹窗 ═══════ */
.code-modal-mask {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(20,26,40,.45);
  display: flex; align-items: center; justify-content: center;
  overflow-y: auto; padding: 20px 14px;
  animation: fadeIn .2s both;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.code-modal {
  position: relative;
  width: min(400px, 100%); margin: auto; padding: 26px 24px 22px; border-radius: 28px;
  background: #ffffff;
  border: 1px solid rgba(24,34,58,.10);
  box-shadow: 0 24px 60px rgba(24,34,58,.22);
  animation: sheetUp .35s cubic-bezier(.22,1.1,.36,1) both;
}
@keyframes sheetUp { from { transform: translateY(40px) scale(.95); opacity: 0; } to { transform: none; opacity: 1; } }
.code-modal h3 { font-size: 18px; font-weight: 700; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
.code-modal .sub { font-size: 12.5px; color: rgba(29,36,51,.62); margin-top: 4px; }
.code-modal .close {
  position: absolute; top: 14px; right: 14px; width: 30px; height: 30px;
  border-radius: 50%; border: 1px solid rgba(24,34,58,.12); background: #ffffff;
  color: rgba(29,36,51,.62); cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center; transition: all .15s;
}
.code-modal .close:hover { background: #eef1f5; color: #1d2433; }
.code-bound-row {
  margin-top: 16px; padding: 14px 16px; border-radius: 16px;
  background: rgba(15,157,88,.08); border: 1px solid rgba(15,157,88,.26);
}
.code-bound-row .label { font-size: 11px; color: #0f9d58; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.code-bound-row .code { font-family: ui-monospace,'SF Mono',monospace; font-size: 14px; color: #0f9d58; margin-top: 4px; letter-spacing: .03em; }
.code-bound-row .detail { font-size: 12px; color: rgba(29,36,51,.62); margin-top: 6px; display: flex; justify-content: space-between; align-items: center; }
.code-bound-row .unbind-btn {
  padding: 6px 12px; border-radius: 10px; border: 1px solid rgba(24,34,58,.12);
  background: #ffffff; color: #1d2433; font-size: 12px;
  cursor: pointer; transition: all .15s;
}
.code-bound-row .unbind-btn:hover { background: rgba(220,38,38,.08); border-color: rgba(220,38,38,.26); color: #dc2626; }
.code-input-row {
  margin-top: 18px; display: flex; flex-direction: column; gap: 10px;
}
.code-input-row input {
  width: 100%; padding: 13px 16px; border-radius: 14px; font-size: 16px;
  font-family: ui-monospace,'SF Mono',monospace; color: #1d2433; outline: none;
  background: #eef1f5; border: 1px solid rgba(24,34,58,.10);
  letter-spacing: .04em; text-align: center;
}
.code-input-row input:focus { border-color: #2f6fed; background: #ffffff; }
.code-input-row input::placeholder { color: rgba(29,36,51,.45); }
.code-btn-row { display: flex; gap: 10px; }
.code-btn-row button {
  flex: 1; padding: 12px 14px; border-radius: 13px; border: 1px solid rgba(24,34,58,.12);
  background: #ffffff; color: #1d2433; font-size: 13px; font-weight: 600;
  box-shadow: 0 2px 8px rgba(24,34,58,.06);
  cursor: pointer; transition: all .15s; font-family: inherit;
}
.code-btn-row button:hover { background: #eef1f5; }
.code-btn-row button.primary {
  background: linear-gradient(180deg, #5b9cf5, #2f6fed); border-color: transparent; color: #fff;
  box-shadow: 0 6px 16px rgba(47,111,237,.28);
}
.code-btn-row button.primary:hover { filter: brightness(1.06); }
.code-query-result {
  margin-top: 12px; padding: 12px 14px; border-radius: 12px; font-size: 13px;
  background: #eef1f5; border: 1px solid rgba(24,34,58,.10);
  color: #1d2433; min-height: 20px;
}
.code-query-result.ok { background: rgba(15,157,88,.10); border-color: rgba(15,157,88,.26); color: #0f9d58; }
.code-query-result.warn { background: rgba(180,83,9,.10); border-color: rgba(180,83,9,.24); color: #b45309; }
.code-query-result.err { background: rgba(220,38,38,.08); border-color: rgba(220,38,38,.24); color: #dc2626; }
.code-progress { margin-top: 8px; height: 3px; background: rgba(24,34,58,.10); border-radius: 2px; overflow: hidden; }
.code-progress i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg,#0f9d58,#2563eb); }

/* ═══════ 手机端 ═══════ */
@media (max-width: 480px) {
  body { padding: 14px 14px 72px; }
  .card { padding: 34px 20px 30px; border-radius: 30px; }
  .file-icon { width: 88px; height: 88px; border-radius: 26px; margin-bottom: 20px; }
  .file-icon .ext { font-size: 22px; }
  h1 { font-size: 18.5px; }
  .stats { gap: 8px; }
  .stat { padding: 13px 6px; border-radius: 18px; }
  .stat .v { font-size: 18px; }
  .btn { padding: 16px; font-size: 16px; border-radius: 20px; }
  .code-modal { border-radius: 24px; padding: 24px 18px 20px; }
  .brand { padding: 0 70px 0 14px; }
}
</style>

/** 语言检测：手动选择 > 浏览器首选语言 > 时区（大中华区） > 英文 */
function detectLang(){
  try {
    const saved = localStorage.getItem('cd_lang');
    if (saved === 'zh' || saved === 'en') return saved;
  } catch {}
  const first = String((navigator.languages && navigator.languages.length ? navigator.languages[0] : navigator.language) || '').toLowerCase();
  if (first.startsWith('zh')) return 'zh';
  if (first) return 'en';
  try {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
    if (/^Asia\/(Shanghai|Chongqing|Harbin|Urumqi|Kashgar|Hong_Kong|Macau|Taipei)$/.test(tz)) return 'zh';
  } catch {}
  return 'en';
}

  let s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.en[key] ?? key;
  if (params) for (const k in params) s = s.split('{' + k + '}').join(params[k]);

};

const EXT_COLORS = {
  zip:'#b45309', rar:'#b45309', '7z':'#b45309', tar:'#b45309', gz:'#b45309',
  pdf:'#dc2626', doc:'#2563eb', docx:'#2563eb', txt:'#6b7280', md:'#6b7280',
  xls:'#0f9d58', xlsx:'#0f9d58', csv:'#0f9d58', ppt:'#c2410c', pptx:'#c2410c',
  mp3:'#7c3aed', wav:'#7c3aed', flac:'#7c3aed', m4a:'#7c3aed',
  mp4:'#dc2626', mov:'#dc2626', mkv:'#dc2626', avi:'#dc2626',
  png:'#15803d', jpg:'#15803d', jpeg:'#15803d', gif:'#15803d', webp:'#15803d', svg:'#15803d',
  apk:'#0f9d58', exe:'#6b7280', iso:'#6b7280', dmg:'#6b7280', default:'#6b7280'
};
function extOf(name){ const m=/\.([a-z0-9]+)$/i.exec(name||''); return m?m[1].toLowerCase():''; }
function extColor(name){ return EXT_COLORS[extOf(name)]||EXT_COLORS.default; }
function fmtSize(n){
  if(!Number.isFinite(n))return '—';
  if(n<1024)return n+' B';
  const u=['KB','MB','GB','TB'];let i=-1;
  do{n/=1024;i++;}while(n>=1024&&i<u.length-1);
  return n.toFixed(n>=100?0:n>=10?1:2)+' '+u[i];
}
function fmtTime(ts){
  const d=new Date(ts),p=x=>String(x).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

const token = location.pathname.split('/')[2];

// 定义在全局作用域：render()、triggerDownload()、wireUnlock() 都需要访问
function getBoundCode(){ try { return localStorage.getItem('r2pan_code')?.trim().toUpperCase() || null; } catch { return null; } }
function setBoundCode(c){ try { if(c) localStorage.setItem('r2pan_code', c.trim().toUpperCase()); else localStorage.removeItem('r2pan_code'); } catch {} }

let TURSTILE_LOADED = false, turnstileReady = false, pendingCb = null;
function loadTurnstileScript(onload){
  if(TURSTILE_LOADED){ if(window.turnstile){ window.turnstile.ready(cb=>{ turnstileReady = true; onload&&onload(cb); }); } return; }
  TURSTILE_LOADED = true;
  window.onTurnstileLoad = () => { turnstileReady = true; onload && onload(window.turnstile); };
  const s = document.createElement('script');
  s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad';
  s.async = true; s.defer = true;
  document.head.appendChild(s);
}

/**
 * 渲染 Turnstile widget 并等待完成。
 * 返回 Promise<string> —— token 字符串。
 */
async function renderTurnstile(containerEl, sitekey){
  containerEl.innerHTML = '<div class="ts-wrap"><div class="ts-box" data-sitekey="'+sitekey+'"></div></div>';
  loadTurnstileScript();
  // 等待 window.turnstile 出现
  await new Promise(resolve => {
    const check = () => { if(window.turnstile){ resolve(); } else { setTimeout(check, 80); } };
    check();
  });
  return await new Promise((resolve, reject) => {
    const id = window.turnstile.render(containerEl.querySelector('.ts-box'), {
      sitekey,
      theme: 'auto',
      callback: (tk) => resolve(tk),
      'error-callback': () => reject(new Error('ts_error')),
      'timeout-callback': () => reject(new Error('ts_timeout')),
    });
    containerEl.dataset.tsWidgetId = id;
  });
}

async function boot(){
  // OAuth callback 返回的错误参数 → 页面顶部提示
  const params = new URLSearchParams(location.search);
  const oauthErr = params.get('oauth_error');

  let info;
  let oauthProviders = [];
  try{
    const r = await fetch(`/s/${token}/info`, {cache:'no-store'});
    if(!r.ok) throw 0;
    info = await r.json();
  }catch{ renderError(t('notFoundTitle'), t('notFoundMsg')); return; }
  // 如果 OAuth2 启用了，拉启用中的 Provider 列表来渲染多个按钮
  if (info.oauth?.enabled) {
    try {
      const r2 = await fetch('/oauth/providers', {cache:'no-store'});
      if (r2.ok) {
        const j = await r2.json();
        oauthProviders = j.providers || [];
      }
    } catch {}
  }
  const siteName = info.site_title || 'cloud-r2pan';
  document.title = t('pageTitle', {site: siteName});
  $('#brand-text').innerHTML = `Powered by <b>${esc(siteName)}</b>`;
  render(info, siteName, oauthErr, oauthProviders);
}

function renderError(title,msg){
  $('#app').innerHTML = `
    <div class="file-icon" style="font-size:44px">🚫</div>
    <h1>${esc(title)}</h1>
    <div class="hint" style="margin-top:12px">${esc(msg)}</div>`;
}

            const pct = st.pct || 0;
            resultBox.innerHTML = t('codeCheckOk', { remaining: fmtBytes(rem), total: st.total>0?fmtBytes(st.total):'∞' });
            if(pct > 0) resultBox.innerHTML += `<div class="code-progress"><i style="width:${pct}%"></i></div>`;
            resultBox.className = 'code-query-result ok';
          }
          if(!d.usable && d.reason){ resultBox.textContent += ' ⚠ ' + (d.message || statusMap[st.status] || d.reason); resultBox.className = 'code-query-result warn'; }
        } else {
          resultBox.textContent = d.message || t('codeCheckBad', {msg: 'not found'}); resultBox.className = 'code-query-result err';
        }
      } catch(err){ resultBox.textContent = t('codeCheckBad', {msg: err.message}); resultBox.className = 'code-query-result err'; }
    };

    // 绑定按钮（保存到 localStorage 并校验）
    mask.querySelector('#code-bind').onclick = async () => {
      const code = input.value.trim().toUpperCase();
      if(!code) return;
      resultBox.style.display = 'block'; resultBox.className = 'code-query-result'; resultBox.textContent = '...';
      try {
        const r = await fetch('/api/codes/status?code=' + encodeURIComponent(code));
        const d = await r.json();
        if(r.ok){
          if(!d.usable){
            resultBox.textContent = d.message || t('codeBindFailed', {msg: d.reason});
            resultBox.className = 'code-query-result err';
            return;
          }
          setBoundCode(code);
          updateCodeFloatBadge();
          resultBox.textContent = t('codeBindSuccess');
          resultBox.className = 'code-query-result ok';
          setTimeout(close, 800);
        } else {
          resultBox.textContent = d.message || t('codeBindFailed', {msg: 'not found'});
          resultBox.className = 'code-query-result err';
        }
      } catch(err){ resultBox.textContent = t('codeBindFailed', {msg: err.message}); resultBox.className = 'code-query-result err'; }
    };

    // 解绑按钮
    const unbindBtn = mask.querySelector('#code-unbind');
    if(unbindBtn){
      unbindBtn.onclick = () => {
        setBoundCode(null);
        updateCodeFloatBadge();
        close();
      };
    }

    // Enter 键 → 绑定
    input?.addEventListener('keydown', e => {
      if(e.key === 'Enter') { e.preventDefault(); mask.querySelector('#code-bind').click(); }
    });
  }

  // 浮动按钮点击 → 打开弹窗
  document.getElementById('code-float')?.addEventListener('click', openCodeModal);


  // 如果 on_share 模式需要弹 Turnstile，现在就开始渲染
  if(needTsNow && tsOnShare && ts.sitekey){
    const box = $('#ts-container');
    renderTurnstile(box, ts.sitekey).then(tk => {
      box.innerHTML = `<div class="ts-passed">${esc(t('turnstilePass'))}</div>`;
      window.__tsToken = tk;
    }).catch(() => { box.innerHTML = `<div class="warn" style="text-align:center;font-size:12.5px">${esc(t('turnstileFail'))}</div>`; });
  }
}

async function triggerDownload(d, ts, tsEnabled, tsOnDownload){
  const baseUrl = `/s/${token}/download`;
  // 读取已绑定的激活码（从 localStorage）
  const code = getBoundCode();
  // both / on_download 模式：先确保有 token
  if(tsEnabled && tsOnDownload){
    let tk = window.__tsToken;
    if(!tk){
      // 还没渲染过 → 现在渲染
      const box = document.createElement('div');
      box.style.cssText = 'margin-top:20px';
      document.body.appendChild(box);
      try{
        tk = await renderTurnstile(box, ts.sitekey);
        window.__tsToken = tk;
        box.remove();
      }catch{ box.remove(); return; }
    }
    let url = `${baseUrl}?cf=${tk}`;
    if(code) url += `&code=${encodeURIComponent(code)}`;
    location.href = url;
  } else {
    let url = baseUrl;
    if(code) url += `?code=${encodeURIComponent(code)}`;
    location.href = url;
  }
}

async function wireUnlock(d, ts, tsEnabled, tsOnDownload){
  const btn = $('#pw-go'), input = $('#pw'), err = $('#pw-err');
  const unlock = async () => {
    const pass = input.value;
    if(!pass) return;
    // 读取已绑定的激活码（从 localStorage）
    const code = getBoundCode();
    btn.style.pointerEvents = 'none'; btn.style.opacity = '.6';
    err.textContent = '';
    // both 模式：需要 Turnstile token
    let turnstileToken = null;
    if(tsEnabled && ts.mode === 'both'){
      let tk = window.__tsToken;
      if(!tk){
        const box = document.createElement('div');
        box.style.cssText = 'margin-top:14px';
        document.getElementById('pw-box').appendChild(box);
        try{
          tk = await renderTurnstile(box, ts.sitekey);
          window.__tsToken = tk;
          box.innerHTML = `<div class="ts-passed">${esc(t('turnstilePass'))}</div>`;
        }catch(e){ box.remove(); err.textContent = t('turnstileFail'); btn.style.pointerEvents = ''; btn.style.opacity = ''; return; }
      }
      turnstileToken = tk;
    }
    try{
      const body = { password: pass };
      if(turnstileToken) body.turnstile = turnstileToken;
      const r = await fetch(`/s/${token}/verify`, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) });
      let res = {};
      try{ res = await r.json(); }catch{}
      if(r.ok && res.url){
        // on_download 模式需要 cf 参数
        if(tsEnabled && tsOnDownload && !res.url.includes('cf=')){
          let tk = window.__tsToken;
          if(!tk){
            const box = document.createElement('div');
            box.style.cssText = 'margin-top:14px';
            document.getElementById('pw-box').appendChild(box);
            tk = await renderTurnstile(box, ts.sitekey);
            window.__tsToken = tk;
            box.innerHTML = `<div class="ts-passed">${esc(t('turnstilePass'))}</div>`;
          }
          const sep = res.url.includes('?') ? '&' : '?';
          let dlUrl = res.url + sep + 'cf=' + tk;
          if(code){ const s2 = dlUrl.includes('?') ? '&' : '?'; dlUrl += s2 + 'code=' + encodeURIComponent(code); }
          location.href = dlUrl;
        } else {
          let dlUrl = res.url;
          if(code){ const s2 = dlUrl.includes('?') ? '&' : '?'; dlUrl += s2 + 'code=' + encodeURIComponent(code); }
          location.href = dlUrl;
        }
        return;
      }
      err.textContent = t(res.error === 'bad_password' ? 'wrongPassword' : 'wrongPassword');
      $('#pw-box').classList.remove('shake'); void $('#pw-box').offsetWidth; $('#pw-box').classList.add('shake');
      input.select();
    }catch{
      err.textContent = t('wrongPassword');
    }
    btn.style.pointerEvents = ''; btn.style.opacity = '';
  };
  btn.onclick = unlock;
  input.addEventListener('keydown', e => { if(e.key === 'Enter') unlock(); });
}

boot();
</script>
