<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cloud-r2pan</title>
<style>
:root {
  --glass: #ffffff;
  --glass-strong: #f3f5f9;
  --stroke: rgba(24,34,58,.10);
  --stroke-strong: rgba(24,34,58,.14);
  --text: #1d2433;
  --text-2: rgba(29,36,51,.62);
  --text-3: rgba(29,36,51,.45);
  --blue: #2f6fed;
  --radius: 24px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: #f5f6f8; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  min-height: 100vh; color: var(--text); position: relative; overflow-x: hidden;
  background: #f5f6f8;
  -webkit-tap-highlight-color: transparent;
}
::selection { background: rgba(47,111,237,.22); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(24,34,58,.18); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }

/* ── 背景光斑 ─────────────────────────── */
.orb { position: fixed; border-radius: 50%; filter: blur(100px); opacity: .45; pointer-events: none; animation: drift 22s ease-in-out infinite alternate; z-index: 0; display: none; }
.o1 { width: 52vmax; height: 52vmax; background: #22d3ee; top: -20%; left: -16%; }
.o2 { width: 44vmax; height: 44vmax; background: #7c5cf6; bottom: -22%; right: -12%; animation-delay: -8s; }
.o3 { width: 30vmax; height: 30vmax; background: #ec4899; top: 48%; left: 12%; animation-delay: -15s; opacity: .3; }
@keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(5vw,-6vh) scale(1.15); } }

/* ── 布局 ─────────────────────────────── */
#app { position: relative; z-index: 1; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 20px clamp(14px, 3vw, 28px) 60px; }

/* ── 玻璃卡片 ─────────────────────────── */
.glass {
  background: #ffffff;
  border: 1px solid rgba(24,34,58,.10);
  border-radius: var(--radius);
  box-shadow: 0 12px 32px rgba(24,34,58,.08);
}

/* ── 顶栏 ─────────────────────────────── */
.topbar {
  position: sticky; top: 12px; z-index: 50; margin-bottom: 22px;
  display: flex; align-items: center; gap: 12px; padding: 12px 18px;
  background: #ffffff;
  border: 1px solid rgba(24,34,58,.10); border-radius: 22px;
  box-shadow: 0 12px 32px rgba(24,34,58,.08);
}
.logo { width: 38px; height: 38px; border-radius: 12px; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, #5b9cf5, #2f6fed);
  box-shadow: 0 6px 16px rgba(47,111,237,.30); }
.logo svg { width: 22px; height: 22px; }
.topbar h1 { font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
.topbar .sub { font-size: 11.5px; color: var(--text-3); margin-top: 1px; }
.topbar .spacer { flex: 1; }
.traffic-pill {
  display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 14px;
  background: #f3f5f9; border: 1px solid rgba(24,34,58,.10);
  font-size: 13px; font-variant-numeric: tabular-nums; cursor: pointer; white-space: nowrap;
  transition: background .2s;
}
.traffic-pill:hover { background: #eef1f5; }
.traffic-pill .bar { width: 52px; height: 5px; border-radius: 3px; background: rgba(24,34,58,.12); overflow: hidden; }
.traffic-pill .bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg,#0f9d58,#2f6fed); transition: width .5s cubic-bezier(.22,1,.36,1); }
.traffic-pill.danger .bar i { background: linear-gradient(90deg,#f59e0b,#dc2626); }
.traffic-pill.danger { color: #dc2626; }

/* ── 分段控制 ─────────────────────────── */
.seg {
  display: flex; gap: 4px; padding: 4px; margin-bottom: 22px; border-radius: 18px;
  background: #eef1f5; border: 1px solid rgba(24,34,58,.10);
  overflow-x: auto; scrollbar-width: none;
}
.seg::-webkit-scrollbar { display: none; }
.seg button {
  flex: 1; white-space: nowrap; padding: 9px 18px; border: none; border-radius: 14px;
  background: transparent; color: var(--text-2); font-size: 14px; font-weight: 600;
  font-family: inherit; cursor: pointer; transition: all .2s;
}
.seg button.active {
  color: #1d2433; background: #ffffff;
  box-shadow: 0 2px 8px rgba(24,34,58,.12);
}

/* ── 统计卡片 ─────────────────────────── */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 18px; }
.stat-card { padding: 20px 22px; border-radius: 22px; animation: fadeUp .5s cubic-bezier(.22,1,.36,1) both; }
.stat-card:nth-child(2){animation-delay:.05s}.stat-card:nth-child(3){animation-delay:.1s}.stat-card:nth-child(4){animation-delay:.15s}
.stat-card .label { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 7px; }
.stat-card .value { margin-top: 8px; font-size: 27px; font-weight: 750; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stat-card .value small { font-size: 14px; font-weight: 600; color: var(--text-2); margin-left: 3px; }
.progress { margin-top: 12px; height: 7px; border-radius: 4px; background: rgba(24,34,58,.08); overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg,#0f9d58,#2f6fed); transition: width .6s cubic-bezier(.22,1,.36,1); }
.progress.hot i { background: linear-gradient(90deg,#f59e0b,#dc2626); }
.stat-card .foot { margin-top: 8px; font-size: 12px; color: var(--text-3); }

/* ── 通用卡片区块 ─────────────────────── */
.section { padding: 22px; margin-bottom: 18px; }
.section-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
.section-title h2 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }

/* ── 图表 ─────────────────────────────── */
.chart { display: flex; align-items: flex-end; gap: 6px; height: 150px; padding-top: 8px; }
.chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 7px; min-width: 0; height: 100%; }
.chart .bar { width: 100%; max-width: 34px; border-radius: 8px 8px 4px 4px;
  background: linear-gradient(180deg, #5b9cf5, rgba(47,111,237,.62));
  transition: height .7s cubic-bezier(.22,1,.36,1); min-height: 3px; position: relative; }
.chart .bar:hover { background: linear-gradient(180deg, #3b82f6, #2f6fed); }
.chart .bar span { position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
  font-size: 11px; color: var(--text-2); opacity: 0; transition: opacity .15s; white-space: nowrap; }
.chart .bar:hover span { opacity: 1; }
.chart .day { font-size: 10.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }

/* ── 表格 ─────────────────────────────── */
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; padding: 9px 10px; color: var(--text-3); font-weight: 600; font-size: 12px;
  background: #eef1f5; border-bottom: 1px solid rgba(24,34,58,.10); white-space: nowrap; }
.tbl td { padding: 11px 10px; border-bottom: 1px solid rgba(24,34,58,.07); white-space: nowrap; vertical-align: middle; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tr { transition: background .15s; }
.tbl tbody tr:hover { background: #eef1f5; }
.tbl .num { font-variant-numeric: tabular-nums; }
.mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace; font-size: 12.5px; }
.name-cell { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.empty { padding: 44px 20px; text-align: center; color: var(--text-3); font-size: 14px; }
.empty .icon { font-size: 34px; margin-bottom: 10px; opacity: .7; }

/* ── 文件图标 ─────────────────────────── */
.ficon { width: 38px; height: 38px; border-radius: 11px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; letter-spacing: -.02em;
  background: #f3f5f9; border: 1px solid rgba(24,34,58,.10); vertical-align: middle; }

/* ── 按钮 ─────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 16px; border: 1px solid rgba(24,34,58,.12); border-radius: 13px;
  background: #ffffff; color: #1d2433; font-size: 13.5px; font-weight: 600; font-family: inherit;
  cursor: pointer; transition: all .18s; white-space: nowrap;
  box-shadow: 0 1px 3px rgba(24,34,58,.06);
}
.btn:hover { background: #f3f5f9; transform: translateY(-1px); }
.btn:active { transform: scale(.96); }
.btn.primary { background: linear-gradient(180deg,#5b9cf5,#2f6fed); border-color: transparent; color: #fff;
  box-shadow: 0 8px 22px rgba(47,111,237,.30); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { background: rgba(220,38,38,.08); border-color: rgba(220,38,38,.28); color: #dc2626; }
.btn.danger:hover { background: rgba(220,38,38,.14); }
.btn.sm { padding: 6px 12px; font-size: 12.5px; border-radius: 10px; }
.btn[disabled] { opacity: .4; pointer-events: none; }

/* ── 上传区 ───────────────────────────── */
.dropzone {
  margin-bottom: 18px; padding: 34px 20px; text-align: center; cursor: pointer;
  border: 1.5px dashed rgba(24,34,58,.18); border-radius: var(--radius);
  background: #f3f5f9; transition: all .2s;
}
.dropzone:hover, .dropzone.over { background: #eef1f5; border-color: rgba(47,111,237,.55); transform: scale(1.005); }
.dropzone .icon { font-size: 34px; margin-bottom: 10px; }
.dropzone .t { font-size: 15px; font-weight: 650; }
.dropzone .d { margin-top: 6px; font-size: 12.5px; color: var(--text-3); }
.upload-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin-top: 10px;
  border-radius: 16px; background: #f3f5f9; border: 1px solid rgba(24,34,58,.10); font-size: 13.5px; }
.upload-item .prog { flex: 1; height: 6px; border-radius: 3px; background: rgba(24,34,58,.10); overflow: hidden; }
.upload-item .prog i { display: block; height: 100%; width: 0; border-radius: 3px;
  background: linear-gradient(90deg,#0f9d58,#2f6fed); transition: width .2s; }
.upload-item .pct { min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); }

/* ── 表单 ─────────────────────────────── */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 7px; }
.field input, .field select {
  width: 100%; padding: 12px 14px; border-radius: 14px; font-size: 15px; font-family: inherit;
  color: #1d2433; background: #f3f5f9; border: 1px solid rgba(24,34,58,.12); outline: none;
  transition: border .2s, background .2s; -webkit-appearance: none; appearance: none;
}
.field input:focus { border-color: rgba(47,111,237,.6); background: #ffffff; }
.field input::placeholder { color: var(--text-3); }
.field .tip { margin-top: 6px; font-size: 12px; color: var(--text-3); line-height: 1.5; }

/* ── iOS 分组设置列表 ─────────────────── */
.group { border-radius: 22px; overflow: hidden; margin-bottom: 16px; }
.group .row {
  display: flex; align-items: center; gap: 12px; padding: 14px 18px;
  border-bottom: 1px solid rgba(24,34,58,.07); background: #ffffff;
}
.group .row:last-child { border-bottom: none; }
.group .row:hover { background: #eef1f5; }
.group .row .info { flex: 1; min-width: 0; }
.group .row .info .t { font-size: 14.5px; font-weight: 600; }
.group .row .info .d { margin-top: 3px; font-size: 12.5px; color: var(--text-3); line-height: 1.5; }
.group .row input[type=number], .group .row input[type=text] {
  width: 110px; padding: 9px 12px; border-radius: 12px; font-size: 14.5px; font-family: inherit;
  color: #1d2433; background: #f3f5f9; border: 1px solid rgba(24,34,58,.12); outline: none; text-align: right;
  font-variant-numeric: tabular-nums;
}
.group .row input[type=number]:focus { border-color: rgba(47,111,237,.6); background: #ffffff; }
.group .row input[type=text] { width: 170px; text-align: left; }

/* iOS 开关 */
.switch { position: relative; width: 50px; height: 30px; flex: none; cursor: pointer; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .track { position: absolute; inset: 0; border-radius: 16px; background: rgba(24,34,58,.14); transition: background .25s; }
.switch .thumb { position: absolute; top: 2px; left: 2px; width: 26px; height: 26px; border-radius: 50%;
  background: #fff; box-shadow: 0 2px 6px rgba(24,34,58,.22); transition: transform .25s cubic-bezier(.22,1.2,.36,1); }
.switch input:checked + .track { background: linear-gradient(180deg,#5b9cf5,#2f6fed); }
.switch input:checked + .track .thumb { transform: translateX(20px); }

/* ── 模态框（底部弹层风格） ───────────── */
.modal-mask { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center;
  background: rgba(24,34,58,.32); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  animation: fadeIn .25s both; }
@media (min-width: 640px) { .modal-mask { align-items: center; padding-bottom: 0; } }
.modal {
  width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
  padding: 26px; border-radius: 32px 32px 0 0;
  background: #ffffff;
  border: 1px solid rgba(24,34,58,.10); border-bottom: none;
  box-shadow: 0 -12px 40px rgba(24,34,58,.16);
  animation: sheetUp .4s cubic-bezier(.22,1.1,.36,1) both;
}
@media (min-width: 640px) { .modal { border-radius: 32px; border-bottom: 1px solid rgba(24,34,58,.10); } }
@keyframes sheetUp { from { transform: translateY(60px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal h3 { font-size: 18px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 4px; }
.modal .sub { font-size: 13px; color: var(--text-3); margin-bottom: 18px; }
.modal .actions { display: flex; gap: 10px; margin-top: 20px; }
.modal .actions .btn { flex: 1; padding: 13px; font-size: 15px; border-radius: 16px; }
.link-box { display: flex; gap: 8px; margin-top: 4px; }
.link-box input { flex: 1; padding: 12px 14px; border-radius: 14px; font-size: 14px;
  font-family: ui-monospace, "SF Mono", monospace; color: #2563eb;
  background: #f3f5f9; border: 1px solid rgba(24,34,58,.10); outline: none; }

/* ── Toast ────────────────────────────── */
#toasts { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 200;
  display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  padding: 11px 22px; border-radius: 16px; font-size: 14px; font-weight: 600; color: #1d2433;
  background: #ffffff;
  border: 1px solid rgba(24,34,58,.10); box-shadow: 0 12px 32px rgba(24,34,58,.16);
  animation: toastIn .35s cubic-bezier(.22,1.2,.36,1) both; max-width: 86vw; text-align: center;
}
.toast.ok { border-color: rgba(15,157,88,.45); }
.toast.err { border-color: rgba(220,38,38,.5); }
.toast.out { animation: toastOut .3s ease both; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-16px) scale(.92); } to { opacity: 1; transform: none; } }
@keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-12px) scale(.94); } }

/* ── 分页 ─────────────────────────────── */
.pager { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; }
.pager .info { font-size: 12.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }

/* ── 状态徽章 ─────────────────────────── */
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 9px; font-size: 11.5px; font-weight: 650; }
.tag.active { background: rgba(52,211,153,.16); color: #0f9d58; }
.tag.expired { background: rgba(255,159,10,.16); color: #b45309; }
.tag.revoked { background: rgba(255,69,58,.16); color: #dc2626; }
.tag.maxed { background: rgba(255,159,10,.16); color: #b45309; }
.tag i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* ── 警示横幅 ─────────────────────────── */
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 15px 18px; margin-bottom: 18px;
  border-radius: 20px; background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.3); }
.banner .ic { font-size: 20px; line-height: 1.3; }
.banner .t { font-size: 14px; font-weight: 650; color: #b45309; }
.banner .d { margin-top: 3px; font-size: 12.5px; color: rgba(180,83,9,.78); line-height: 1.55; }

/* ── 登录页 ───────────────────────────── */
#login-view { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; z-index: 1; }
.login-card { width: 100%; max-width: 380px; padding: 44px 34px 36px; text-align: center;
  border-radius: 36px; animation: fadeUp .6s cubic-bezier(.22,1.1,.36,1) both; }
.login-card .logo { width: 74px; height: 74px; border-radius: 24px; margin: 0 auto 20px; }
.login-card .logo svg { width: 40px; height: 40px; }
.login-card h1 { font-size: 23px; font-weight: 750; letter-spacing: -.03em; }
.login-card .sub { margin: 8px 0 26px; font-size: 13.5px; color: var(--text-3); }
.login-card input { width: 100%; padding: 15px 18px; border-radius: 18px; font-size: 16px; font-family: inherit;
  color: #1d2433; background: #f3f5f9; border: 1px solid rgba(24,34,58,.12); outline: none; text-align: center;
  transition: border .2s, background .2s; }
.login-card input:focus { border-color: rgba(47,111,237,.65); background: #ffffff; }
.login-card .btn { width: 100%; margin-top: 14px; padding: 15px; font-size: 16px; border-radius: 18px; }
.login-card .err { margin-top: 12px; font-size: 13px; color: #dc2626; min-height: 18px; }
.login-card .lang-row { margin-top: 18px; }
.shake { animation: shake .4s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-9px)} 40%,80%{transform:translateX(9px)} }

@keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(24,34,58,.12); border-top-color: #2f6fed; animation: spin .8s linear infinite; margin: 30px auto; }
@keyframes spin { to { transform: rotate(360deg); } }

.actions-cell { display: flex; gap: 6px; }
@media (max-width: 720px) {
  .tbl th:nth-child(n+5), .tbl td:nth-child(n+5) { display: none; }
  .topbar .sub { display: none; }
}
</style>
</head>

/** 语言检测：手动选择 > 浏览器首选语言 > 时区（大中华区） > 英文 */
function detectLang(){
  try {
    const saved = localStorage.getItem('cd_lang');
    if (saved === 'zh' || saved === 'en') return saved;
  } catch {}
  const first = String((navigator.languages && navigator.languages.length ? navigator.languages[0] : navigator.language) || '').toLowerCase();
  if (first.startsWith('zh')) return 'zh';
  if (first) return 'en';
  try {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
    if (/^Asia\/(Shanghai|Chongqing|Harbin|Urumqi|Kashgar|Hong_Kong|Macau|Taipei)$/.test(tz)) return 'zh';
  } catch {}
  return 'en';
}

let LANG = detectLang();
const t = (key, params) => {
  let s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.en[key] ?? key;
  if (params) for (const k in params) s = s.split('{' + k + '}').join(params[k]);
  return s;
};
document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';

/* ═══════════ 工具函数 ═══════════ */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmtSize(n){
  n = Number(n)||0;
  if(n < 1024) return n + ' B';
  const u = ['KB','MB','GB','TB']; let i = -1;
  do { n /= 1024; i++; } while(n >= 1024 && i < u.length-1);
  return n.toFixed(n >= 100 ? 0 : n >= 10 ? 1 : 2) + ' ' + u[i];
}
function fmtTime(ts){
  if(!ts) return '—';
  const d = new Date(Number(ts)), p = x => String(x).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
const EXT_COLORS = {
  zip:'#b45309',rar:'#b45309','7z':'#b45309',tar:'#b45309',gz:'#b45309',
  pdf:'#dc2626',doc:'#2563eb',docx:'#2563eb',txt:'#6b7280',md:'#6b7280',
  xls:'#0f9d58',xlsx:'#0f9d58',csv:'#0f9d58',ppt:'#b45309',pptx:'#b45309',

  mp4:'#dc2626',mov:'#dc2626',mkv:'#dc2626',avi:'#dc2626',

  apk:'#0f9d58',exe:'#6b7280',iso:'#6b7280',dmg:'#6b7280',default:'#475569'
};
const extOf = n => (/\.([a-z0-9]+)$/i.exec(n||'')||[])[1]?.toLowerCase() || '';
const extColor = n => EXT_COLORS[extOf(n)] || EXT_COLORS.default;
const ficon = name => `<span class="ficon" style="color:${extColor(name)}">${esc((extOf(name)||'?').toUpperCase().slice(0,4))}</span>`;

async function api(path, opts={}){
  const r = await fetch(path, { credentials:'same-origin', ...opts,
    headers: { ...(opts.body && !(opts.body instanceof FormData) ? {'content-type':'application/json'} : {}), ...(opts.headers||{}) } });
  let data = null;
  try { data = await r.json(); } catch {}
  if(r.status === 401 && !path.includes('/login')) { showLogin(); throw new Error('unauthorized'); }
  if(!r.ok) throw new Error(data?.error || `HTTP ${r.status}`);
  return data;
}

function toast(msg, type='ok'){
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 2600);
}

function copyText(text){
  if(navigator.clipboard?.writeText) return navigator.clipboard.writeText(text).then(() => toast(t('copied')));
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); ta.remove();
  return Promise.resolve(toast(t('copied')));
}

const confirmDialog = (title, msg, danger=true) => new Promise(resolve => {
  openModal(`
    <h3>${esc(title)}</h3>
    <div class="sub">${esc(msg)}</div>
    <div class="actions">
      <button class="btn" data-x>${esc(t('cancel'))}</button>
      <button class="btn ${danger?'danger':'primary'}" data-ok>${esc(t('confirm'))}</button>
    </div>`);
  $('[data-ok]').onclick = () => { closeModal(); resolve(true); };
  $('[data-x]').onclick = () => { closeModal(); resolve(false); };
});

function toggleLang(){
  try { localStorage.setItem('cd_lang', LANG === 'zh' ? 'en' : 'zh'); } catch {}
  location.reload();
}

/* ═══════════ 模态框 ═══════════ */
function openModal(html){
  closeModal();
  const mask = document.createElement('div');
  mask.className = 'modal-mask'; mask.id = 'modal';
  mask.innerHTML = `<div class="modal">${html}</div>`;
  mask.addEventListener('click', e => { if(e.target === mask) closeModal(); });
  document.body.appendChild(mask);
}
function closeModal(){ $('#modal')?.remove(); }

/* ═══════════ 登录视图（支持 2FA 两阶段） ═══════════ */
let siteTitle = 'cloud-r2pan';
let loginStage = 'password'; // 'password' | '2fa' | 'recovery'
let savedLoginKey = ''; // 第一阶段输入的 admin key

function showLogin(){
  document.title = t('docTitle', {site: siteTitle});

  if(loginStage === 'password'){
    renderLoginCard(`
      <h1>${esc(siteTitle)}</h1>
      <div class="sub">${esc(t('loginSubtitle'))}</div>
      <form id="login-form">
        <input type="password" id="login-key" placeholder="${esc(t('keyPlaceholder'))}" autocomplete="current-password" autofocus>
        <button class="btn primary" type="submit">${esc(t('login'))}</button>
        <div class="err" id="login-err"></div>
      </form>
      <div class="lang-row"><button class="btn sm" id="login-lang">${esc(t('switchTo'))}</button></div>
    `);
    $('#login-form').onsubmit = async e => {
      e.preventDefault();
      const key = $('#login-key').value.trim();
      if(!key) return;
      savedLoginKey = key;
      $('#login-err').textContent = '';
      try{
        const r = await api('/api/admin/login', { method:'POST', body: JSON.stringify({ key }) });
        if(r.need_2fa){
          loginStage = '2fa';
          showLogin();
        }else{
          showApp();
        }
      }catch(err){
        $('#login-err').textContent = err.message;
        shake();
      }
    };
    $('#login-lang').onclick = toggleLang;
  } else if(loginStage === '2fa'){
    renderLoginCard(`
      <h1>${esc(t('login2faTitle'))}</h1>
      <div class="sub">${esc(t('login2faSub'))}</div>
      <form id="login-form">
        <input type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" id="login-code" placeholder="${esc(t('login2faPh'))}" autocomplete="one-time-code" autofocus style="text-align:center;letter-spacing:.4em;font-size:20px">
        <button class="btn primary" type="submit">${esc(t('login2faCode'))}</button>
        <div class="err" id="login-err"></div>
      </form>
      <div style="margin-top:14px;display:flex;gap:10px;justify-content:center">
        <button class="btn sm" id="login-back">${esc(t('login2faBack'))}</button>
        <button class="btn sm" id="login-recovery">${esc(t('login2faUseRecovery'))}</button>
      </div>
    `);
    $('#login-form').onsubmit = async e => {
      e.preventDefault();
      const code = $('#login-code').value.trim();
      if(!/^\d{6}$/.test(code)) return;
      $('#login-err').textContent = '';
      try{
        const r = await api('/api/admin/login', { method:'POST', body: JSON.stringify({ key: savedLoginKey, code }) });
        showApp();
      }catch(err){
        $('#login-err').textContent = err.message;
        shake();
      }
    };
    $('#login-back').onclick = () => { loginStage = 'password'; showLogin(); };
    $('#login-recovery').onclick = () => { loginStage = 'recovery'; showLogin(); };
  } else {
    renderLoginCard(`
      <h1>${esc(t('login2faTitle'))}</h1>
      <div class="sub">${esc(t('login2faRecoveryHint'))}</div>
      <form id="login-form">
        <input type="text" id="login-recovery-code" placeholder="${esc(t('login2faRecoveryPh'))}" autocomplete="off" autofocus style="letter-spacing:.15em">
        <button class="btn primary" type="submit">${esc(t('confirm'))}</button>
        <div class="err" id="login-err"></div>
      </form>
      <div style="margin-top:14px">
        <button class="btn sm" id="login-back">${esc(t('login2faBack'))}</button>
      </div>
    `);
    $('#login-form').onsubmit = async e => {
      e.preventDefault();
      const code = $('#login-recovery-code').value.trim();
      if(!code) return;
      $('#login-err').textContent = '';
      try{
        const r = await api('/api/admin/login', { method:'POST', body: JSON.stringify({ key: savedLoginKey, code }) });
        if(r.recovery_used && r.totp_reset){
          // 弹出恢复成功提示
          openModal(`
            <h3>${esc(t('login2faRecoveryOk'))}</h3>
            <div class="sub">${esc(t('login2faRecoveryHint'))}</div>
            <div class="actions"><button class="btn primary" id="ok">${esc(t('confirm'))}</button></div>
          `);
          $('#ok').onclick = () => { closeModal(); showApp(); };
          return;
        }
        showApp();
      }catch(err){
        $('#login-err').textContent = err.message;
        shake();
      }
    };
    $('#login-back').onclick = () => { loginStage = '2fa'; showLogin(); };

            <td><div class="actions-cell">

  const sel = $('#fo-filter');

    await api(`/api/admin/folders/${encodeURIComponent(filesFolder)}`, { method:'DELETE' });

  dz.ondragleave = () => dz.classList.remove('over');
  dz.ondrop = e => { e.preventDefault(); dz.classList.remove('over'); uploadFiles([...e.dataTransfer.files]); };

  $$('[data-share]').forEach(b => b.onclick = () => openShareModal(b.dataset.share));

function openNewFolderModal(){
  openModal(`
    <h3>${esc(t('newFolder'))}</h3>
    <div class="sub">${esc(t('folderNamePh'))}</div>
    <div class="field"><input type="text" id="fo-name" placeholder="${esc(t('folderNamePh'))}" autocomplete="off" maxlength="60"></div>
    <div class="actions">
      <button class="btn" data-x>${esc(t('cancel'))}</button>
      <button class="btn primary" data-ok>${esc(t('confirm'))}</button>
    </div>`);
  const inp = $('#fo-name');
  inp.focus();
  const submit = async () => {
    const name = inp.value.trim();
    if(!name){ toast(t('folderNameEmpty'), 'err'); return; }
    try {
      const r = await api('/api/admin/folders', { method:'POST', body: JSON.stringify({ name }) });
      toast(t('folderCreatedToast', { name: r.name }));
      closeModal();
      filesFolder = r.id;
      loadFiles();
    } catch(e){ toast(e.message, 'err'); }
  };
  $('[data-ok]').onclick = submit;
  $('[data-x]').onclick = closeModal;
  inp.onkeydown = e => { if(e.key === 'Enter') submit(); };
}

function uploadFiles(files){
  for(const file of files){
    if(file.size > 100 * 1024 * 1024){ toast(t('tooLarge', {name: file.name}), 'err'); continue; }
    const item = document.createElement('div');
    item.className = 'upload-item glass';
    item.innerHTML = `${ficon(file.name)}<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(file.name)}</span>
      <div class="prog"><i></i></div><span class="pct">0%</span>`;
    $('#upload-list').prepend(item);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/admin/upload');
    xhr.setRequestHeader('X-File-Name', encodeURIComponent(file.name));
    if(filesFolder && filesFolder !== 'root') xhr.setRequestHeader('X-Folder-Id', filesFolder);
    xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    xhr.upload.onprogress = e => {
      const pct = Math.round(e.loaded / e.total * 100);
      item.querySelector('.prog i').style.width = pct + '%';
      item.querySelector('.pct').textContent = pct + '%';
    };
    xhr.onload = () => {
      if(xhr.status === 201){ item.querySelector('.pct').textContent = t('uploadDone'); toast(t('uploadOk', {name: file.name})); loadFiles(); }
      else { item.querySelector('.pct').textContent = t('uploadFailShort'); toast(t('uploadFail', {name: file.name}), 'err'); }
    };
    xhr.onerror = () => { item.querySelector('.pct').textContent = t('uploadFailShort'); toast(t('uploadFail', {name: file.name}), 'err'); };
    xhr.send(file);
  }
}

/* ═══════════ 全球分布 —— ECharts 3D 地球仪 ═══════════ */
let echartsLoaded = false;
let echartsLoadingPromise = null;
let globalDays = 30;
let globeChart = null;

/** 动态加载 ECharts + echarts-gl + world-atlas（首次进入全球分布 Tab 时才加载） */
function ensureECharts(){
  if (echartsLoaded) return Promise.resolve();
  if (echartsLoadingPromise) return echartsLoadingPromise;
  echartsLoadingPromise = new Promise((resolve, reject) => {
    // 按顺序加载：echarts → echarts-gl → world-atlas 地图数据
    const loadScript = (src, cb) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = cb;
      s.onerror = () => reject(new Error('Failed to load ' + src));
      document.head.appendChild(s);
    };
    loadScript('https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js', () => {
      loadScript('https://cdn.jsdelivr.net/npm/echarts-gl@2.0.9/dist/echarts-gl.min.js', () => {
        loadScript('https://cdn.jsdelivr.net/npm/echarts@5.5.1/map/json/world.json', () => {
          echartsLoaded = true;
          resolve();
        });
      });
    });
  });
  return echartsLoadingPromise;
}

      symbolSize: (val) => Math.max(4, Math.min(30, Math.sqrt(val[2] / maxDownloads) * 30)),
      itemStyle: { color: '#2563eb', shadowBlur: 10, shadowColor: 'rgba(37,99,235,.35)' },
      data: globeData.map(d => ({ name: d.name, value: d.value, ...d })),

    geo: {
      map: 'world',

      itemStyle: { areaColor: '#e2e8f0', borderColor: '#cbd5e1' },

  const rows = countries.slice(0, 20).map(c => {

    return `<tr>
      <td>${countryName(c.country)} <span style="color:var(--text-3);font-size:11px">${c.country}</span></td>
      <td class="num">${c.downloads}</td>

      <td class="num">${c.unique_ips}</td>

    </tr>`;
  }).join('');
  $('#global-table-wrap').innerHTML = `
    <div class="glass section" style="padding:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">

        <span style="color:var(--text-3);font-size:12px">${esc(t('globalGeoSource'))}</span>
      </div>
      <table class="tbl">
        <thead><tr>
          <th>${esc(t('globalCountry'))}</th>
          <th>${esc(t('globalDownloads'))}</th>
          <th>${esc(t('globalBytes'))}</th>
          <th>${esc(t('globalUniqueIps'))}</th>
          <th>%</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

/* ═══════════ 激活码管理 ═══════════ */
let codesPage = 1;
let codesStatus = '';
let codesBatchId = '';
let codesPlan = '';
let codesQ = '';

async function loadCodes(){
  const [usage, batches] = await Promise.all([
    api('/api/admin/codes/usage'),
    api('/api/admin/codes/batches').catch(() => ({batches: []})),
  ]);
  const sum = usage.summary || {};
  const batchesList = usage.batches || [];
  const batchOptions = (batches.batches || batchesList.map(b => ({batch_id: b.batch_id, count: b.n || b.count})));
  const plans = [...new Set(batchOptions.map(b => b.batch_id))];

  const totalCodes = sum.total || 0;
  const usedCodes = (sum.active||0) + (sum.exhausted||0) + (sum.expired||0);
  const totalTrafficGB = ((sum.total_bytes||0) / 1024 / 1024 / 1024).toFixed(2);
  const usedTrafficGB = ((sum.used_bytes||0) / 1024 / 1024 / 1024).toFixed(2);
  const trafficPct = sum.total_bytes > 0 ? Math.round((sum.used_bytes / sum.total_bytes) * 100) : 0;

  const v = $('#view');
  v.innerHTML = `
    <div class="glass section">
      <div class="section-title">
        <h2>🎟️ ${esc(t('codesTitle'))}</h2>
      </div>
      <div class="sub" style="color:var(--text-2);font-size:13px;margin-bottom:14px">${esc(t('codesSub'))}</div>

      <!-- 用量概览 -->
      <div class="stats-row" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px">
        <div class="stat-box" style="background:#f3f5f9;border-radius:14px;padding:14px;border:1px solid var(--stroke)">
          <div style="color:var(--text-3);font-size:12px">${esc(t('codesColCode'))} / Total</div>
          <div style="font-size:22px;font-weight:700;margin-top:4px">${totalCodes}</div>
        </div>
        <div class="stat-box" style="background:#f3f5f9;border-radius:14px;padding:14px;border:1px solid var(--stroke)">
          <div style="color:var(--text-3);font-size:12px">${esc(t('codesStatusUnused'))}</div>
          <div style="font-size:22px;font-weight:700;margin-top:4px;color:#0f9d58">${sum.unused||0}</div>
        </div>
        <div class="stat-box" style="background:#f3f5f9;border-radius:14px;padding:14px;border:1px solid var(--stroke)">
          <div style="color:var(--text-3);font-size:12px">${esc(t('codesStatusActive'))}</div>
          <div style="font-size:22px;font-weight:700;margin-top:4px;color:#2563eb">${sum.active||0}</div>
        </div>
        <div class="stat-box" style="background:#f3f5f9;border-radius:14px;padding:14px;border:1px solid var(--stroke)">
          <div style="color:var(--text-3);font-size:12px">${esc(t('codesColTraffic'))}</div>
          <div style="font-size:18px;font-weight:700;margin-top:4px">${usedTrafficGB} / ${totalTrafficGB} GB</div>
          <div style="margin-top:6px;height:4px;background:rgba(24,34,58,.10);border-radius:2px;overflow:hidden">
            <div style="height:100%;width:${trafficPct}%;background:linear-gradient(90deg,#0f9d58,#2563eb);border-radius:2px"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 批量生成 -->
    <div class="glass section">
      <div class="section-title">
        <h2>⚡ ${esc(t('codesGenerateTitle'))}</h2>
      </div>
      <div id="codes-gen-form" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px">
        <div class="field" style="margin:0">
          <label>${esc(t('codesCount'))}</label>
          <input type="number" id="cg-count" min="1" max="10000" value="100">
        </div>
        <div class="field" style="margin:0">
          <label>${esc(t('codesTraffic'))}</label>
          <input type="number" id="cg-traffic" min="0" value="10">
        </div>
        <div class="field" style="margin:0">
          <label>${esc(t('codesDays'))}</label>
          <input type="number" id="cg-days" min="0" value="30">
        </div>
        <div class="field" style="margin:0">
          <label>${esc(t('codesPlanName'))}</label>
          <input type="text" id="cg-plan" placeholder="Pro / Basic / ...">
        </div>
        <div class="field" style="margin:0">
          <label>${esc(t('codesNotes'))}</label>
          <input type="text" id="cg-notes" placeholder="">
        </div>
        <div class="field" style="margin:0">
          <label>${esc(t('codesQuotaMsg'))}</label>
          <input type="text" id="cg-msg" placeholder="">
        </div>
      </div>
      <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn primary" id="cg-do">${esc(t('codesGenerate'))}</button>
      </div>
      <div id="cg-preview" style="margin-top:14px"></div>
    </div>

    <!-- 列表 -->
    <div class="glass section">
      <div class="section-title">
        <h2>📋 ${esc(t('codesListTitle'))} <span id="codes-total-count" style="color:var(--text-3);font-weight:400;font-size:13px"></span></h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <select id="cf-status" style="padding:8px 12px;border-radius:10px;background:#f3f5f9;border:1px solid rgba(24,34,58,.12);color:#1d2433;font-size:13px;font-family:inherit;outline:none">
            <option value="">${esc(t('codesFilterAll'))} ${esc(t('codesFilterStatus'))}</option>
            <option value="unused">${esc(t('codesStatusUnused'))}</option>
            <option value="active">${esc(t('codesStatusActive'))}</option>
            <option value="expired">${esc(t('codesStatusExpired'))}</option>
            <option value="exhausted">${esc(t('codesStatusExhausted'))}</option>
            <option value="revoked">${esc(t('codesStatusRevoked'))}</option>
          </select>
          <select id="cf-batch" style="padding:8px 12px;border-radius:10px;background:#f3f5f9;border:1px solid rgba(24,34,58,.12);color:#1d2433;font-size:13px;font-family:inherit;outline:none">
            <option value="">${esc(t('codesFilterAll'))} ${esc(t('codesFilterBatch'))}</option>
            ${batchOptions.map(b => `<option value="${esc(b.batch_id)}">${esc(b.batch_id)} (${b.count||b.n||0})</option>`).join('')}
          </select>
          <input type="text" id="cf-q" placeholder="${esc(t('codesFilterQ'))}" value="${esc(codesQ)}" style="padding:8px 12px;border-radius:10px;background:#f3f5f9;border:1px solid rgba(24,34,58,.12);color:#1d2433;font-size:13px;font-family:inherit;outline:none;width:180px">
          <button class="btn sm" id="cf-export">${esc(t('codesExportCsv'))}</button>
          <button class="btn sm danger" id="cf-revoke-batch">${esc(t('codesRevokeBatch'))}</button>
        </div>
      </div>
      <div id="codes-table"></div>
      <div id="codes-pg" style="margin-top:14px;display:flex;justify-content:center;gap:10px"></div>
    </div>
  `;

  // 生成按钮
  $('#cg-do').onclick = async () => {
    const count = Math.max(1, Math.min(10000, Number($('#cg-count').value) || 100));
    const traffic = Math.max(0, Number($('#cg-traffic').value) || 0);
    const days = Math.max(0, Number($('#cg-days').value) || 0);
    if (traffic === 0 && days === 0) { toast('Set at least traffic OR days', 'err'); return; }
    try {
      const r = await api('/api/admin/codes/generate', { method:'POST', body: JSON.stringify({
        count, traffic_bytes: traffic * 1024 * 1024 * 1024, days_valid: days,
        plan_name: $('#cg-plan').value.trim() || undefined,
        quota_message: $('#cg-msg').value.trim() || undefined,
        notes: $('#cg-notes').value.trim() || undefined,
      })});
      toast(t('codesGeneratedN', {n: r.count}));
      const preview = r.codes || [];
      $('#cg-preview').innerHTML = `
        <div style="color:var(--text-3);font-size:12px;margin-bottom:6px">${esc(t('codesGeneratedPreview'))}</div>
        <div style="background:rgba(245,158,11,.08);border-radius:12px;padding:12px;font-family:ui-monospace,'SF Mono',monospace;font-size:12px;color:#b45309;line-height:1.7;max-height:200px;overflow:auto">
          ${preview.map(c => `<div>${esc(c)}</div>`).join('')}
        </div>
      `;
      codesPage = 1;
      loadCodesList();
    } catch(err) { toast(err.message, 'err'); }
  };

  // 过滤器
  $('#cf-status').onchange = () => { codesStatus = $('#cf-status').value; codesPage = 1; loadCodesList(); };
  $('#cf-batch').onchange = () => { codesBatchId = $('#cf-batch').value; codesPage = 1; loadCodesList(); };
  $('#cf-q').addEventListener('input', (e) => {
    clearTimeout(window.__codesQ_t);
    window.__codesQ_t = setTimeout(() => { codesQ = e.target.value.trim(); codesPage = 1; loadCodesList(); }, 300);
  });

  // CSV 导出
  $('#cf-export').onclick = () => {
    const sp = new URLSearchParams();
    sp.set('export', '1');
    if (codesStatus) sp.set('status', codesStatus);
    if (codesBatchId) sp.set('batch_id', codesBatchId);
    if (codesQ) sp.set('q', codesQ);
    location.href = '/api/admin/codes?' + sp.toString();
  };

  // 按批次作废
  $('#cf-revoke-batch').onclick = async () => {
    if (!codesBatchId) { toast('Select a batch first', 'err'); return; }
    if (!(await confirmDialog(t('codesConfirmRevokeT'), t('codesConfirmRevokeD') + ' Batch: ' + codesBatchId, true))) return;
    try {
      const r = await api('/api/admin/codes/batch-revoke', { method:'POST', body: JSON.stringify({ batch_id: codesBatchId }) });
      toast(t('codesBatchRevokeOk', {n: r.updated || r.count || 0}));
      loadCodes();
    } catch(err) { toast(err.message, 'err'); }
  };

  // 自动选中第一个有效批次（如果还没选），让"按批次作废"等操作立即可用
  if (!codesBatchId && batchOptions.length > 0) {
    codesBatchId = batchOptions[0].batch_id;
    const sel = $('#cf-batch');
    if (sel) sel.value = codesBatchId;
  }

  loadCodesList();
}

async function loadCodesList(){
  const params = new URLSearchParams();
  params.set('page', codesPage);
  params.set('size', 50);
  if (codesStatus) params.set('status', codesStatus);
  if (codesBatchId) params.set('batch_id', codesBatchId);
  if (codesPlan) params.set('plan', codesPlan);
  if (codesQ) params.set('q', codesQ);
  try {
    const d = await api('/api/admin/codes?' + params.toString());
    $('#codes-total-count').textContent = `(${d.total})`;
    if (!d.rows || !d.rows.length) {
      $('#codes-table').innerHTML = `<div class="empty"><div class="icon">🎟️</div>${esc(t('codesNoCodes'))}</div>`;
      $('#codes-pg').innerHTML = '';
      return;
    }
    const statusLabel = { unused: t('codesStatusUnused'), active: t('codesStatusActive'), expired: t('codesStatusExpired'), exhausted: t('codesStatusExhausted'), revoked: t('codesStatusRevoked') };
    const statusColor = { unused: '#6b7280', active: '#2563eb', expired: '#b45309', exhausted: '#dc2626', revoked: '#6b7280' };
    $('#codes-table').innerHTML = `
      <div style="overflow-x:auto">
      <table class="admin-table" style="width:100%;border-collapse:separate;border-spacing:0;font-size:13px">
        <thead>
          <tr style="text-align:left;color:var(--text-2);border-bottom:1px solid var(--stroke)">
            <th style="padding:10px 8px">${esc(t('codesColCode'))}</th>
            <th style="padding:10px 8px">${esc(t('codesColPlan'))}</th>
            <th style="padding:10px 8px">${esc(t('codesColBatch'))}</th>
            <th style="padding:10px 8px">${esc(t('codesColTraffic'))}</th>
            <th style="padding:10px 8px">${esc(t('codesColStatus'))}</th>
            <th style="padding:10px 8px">${esc(t('codesColActivated'))}</th>
            <th style="padding:10px 8px">${esc(t('codesColActions'))}</th>
          </tr>
        </thead>
        <tbody>
          ${d.rows.map(r => {
            const trafficGB = r.traffic_bytes > 0 ? (r.traffic_bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB' : (r.days_valid > 0 ? t('codesUnlimited') : t('codesRemainingInfinite'));
            const usedGB = r.used_bytes > 0 ? (r.used_bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB' : '0';
            const pct = r.pct || 0;
            return `<tr style="border-bottom:1px solid rgba(24,34,58,.07)">
              <td style="padding:10px 8px;font-family:ui-monospace,'SF Mono',monospace;color:#b45309">${esc(r.code)}</td>
              <td style="padding:10px 8px;color:var(--text-2)">${esc(r.plan_id||'—')}</td>
              <td style="padding:10px 8px;color:var(--text-2)">${esc(r.batch_id||'—')}</td>
              <td style="padding:10px 8px">
                <div>${usedGB} / ${trafficGB}</div>
                ${r.traffic_bytes > 0 ? `<div style="margin-top:4px;height:3px;background:rgba(24,34,58,.10);border-radius:2px;overflow:hidden"><div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#0f9d58,#2563eb);border-radius:2px"></div></div>` : ''}
              </td>
              <td style="padding:10px 8px"><span style="color:${statusColor[r.status]||'#1d2433'}">${esc(statusLabel[r.status]||r.status)}</span></td>
              <td style="padding:10px 8px;color:var(--text-2)">${fmtTime(r.activated_at)}</td>
              <td style="padding:10px 8px">
                <button class="btn sm" data-query="${esc(r.code)}">${esc(t('codesQueryRemainBtn'))}</button>
                ${r.status !== 'revoked' ? `<button class="btn sm danger" data-revoke="${esc(r.id)}">${esc(t('codesRevokeOne'))}</button>` : ''}
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>
    `;

    // 行事件
    $$('#codes-table [data-revoke]').forEach(btn => btn.onclick = async () => {
      if (!(await confirmDialog(t('codesConfirmRevokeT'), t('codesConfirmRevokeD'), true))) return;
      try {
        await api('/api/admin/codes/' + btn.dataset.revoke + '/revoke', { method:'POST' });
        toast('OK');
        loadCodesList();
      } catch(err) { toast(err.message, 'err'); }
    });
    $$('#codes-table [data-query]').forEach(btn => btn.onclick = async () => {
      try {
        const r = await fetch('/api/codes/status?code=' + encodeURIComponent(btn.dataset.query));
        const d = await r.json();
        if (!r.ok) { toast(d.message || t('codesQueryNotFound'), 'err'); return; }
        const rem = d.status.remaining;
        const total = d.status.total;
        if (rem === -1) toast(t('codesQueryResultInfinite'));
        else toast(t('codesQueryResult', { remaining: fmtSize(rem), total: total > 0 ? fmtSize(total) : '∞' }));
      } catch(err) { toast(err.message, 'err'); }
    });

    // 分页
    const pages = Math.ceil(d.total / d.page_size);
    $('#codes-pg').innerHTML = pages > 1 ? `
      <button class="btn sm" ${d.page<=1?'disabled':''} id="pg-prev">${esc(t('prev'))}</button>
      <span style="font-size:13px;color:var(--text-2);align-self:center">${esc(t('pageOf', {a: d.page, b: pages}))}</span>
      <button class="btn sm" ${d.page>=pages?'disabled':''} id="pg-next">${esc(t('next'))}</button>
    ` : '';
    $('#pg-prev')?.addEventListener('click', () => { codesPage--; loadCodesList(); });
    $('#pg-next')?.addEventListener('click', () => { codesPage++; loadCodesList(); });
  } catch(err) { toast(err.message, 'err'); }
}

      <div class="field" style="margin-top:14px">

          <option value="on_share" ${s.turnstile_mode==='on_share'?'selected':''} style="color:#111">${esc(t('tsModeShare'))}</option>

          <option value="both" ${s.turnstile_mode==='both'?'selected':''} style="color:#111">${esc(t('tsModeBoth'))}</option>
        </select>
      </div>
      <div class="field">
        <label>${esc(t('tsThreshold'))}</label>
        <input type="number" id="ts-th" min="0" max="10000" value="${s.turnstile_threshold ?? 5}" style="width:100%;padding:10px 12px;border-radius:12px;font-size:13px;color:#1d2433;background:#f3f5f9;border:1px solid rgba(24,34,58,.12);outline:none">
        <div class="tip">${esc(t('tsThresholdHelp'))}</div>
      </div>
      <div class="field">
        <label>${esc(t('tsSitekeyOverride'))}</label>
        <input type="text" id="ts-sko" value="${esc(s.turnstile_sitekey_override ?? '')}" placeholder="0xAAAA..." style="width:100%;padding:10px 12px;border-radius:12px;font-size:13px;color:#1d2433;background:#f3f5f9;border:1px solid rgba(24,34,58,.12);outline:none;font-family:ui-monospace,'SF Mono',monospace">
      </div>
      <div class="field">
        <label>${esc(t('tsSecretOverride'))}</label>
        <input type="password" id="ts-secret" value="" placeholder="${s.cloudflare_turnstile_secret || s.turnstile_secret_configured ? esc(t('tsSecretKeep')) : esc(t('tsSecretPlaceholder'))}" style="width:100%;padding:10px 12px;border-radius:12px;font-size:13px;color:#1d2433;background:#f3f5f9;border:1px solid rgba(24,34,58,.12);outline:none;font-family:ui-monospace,'SF Mono',monospace">
        <div class="tip" style="line-height:1.6">
          ${s.cloudflare_turnstile_secret
            ? `<span style="color:#0f9d58">✓ ${esc(t('tsSecretOk'))} — ${esc(t('tsSecretInCloudflare'))}</span>`
            : s.turnstile_secret_configured
              ? `<span style="color:#2563eb">✓ ${esc(t('tsSecretOk'))} — ${esc(t('tsSecretInDatabase'))}</span>`
              : `<span style="color:#dc2626">⚠ ${esc(t('tsSecretMissing'))} — ${esc(t('tsSecretHint'))}</span>`}<br>
          ${s.cloudflare_turnstile_sitekey
            ? `<span style="color:#0f9d58">✓ Sitekey ${esc(t('tsInCloudflare'))}</span>`
            : s.turnstile_sitekey_override
              ? `<span style="color:#2563eb">✓ Sitekey ${esc(t('tsInDatabase'))}</span>`
              : `<span style="color:#b45309">⚠ Sitekey ${esc(t('tsMissingBoth'))}</span>`}
        </div>
      </div>
      <div class="actions" style="margin-top:18px">
        <button class="btn" data-x>${esc(t('cancel'))}</button>
        <button class="btn primary" id="ts-save">${esc(t('save'))}</button>
      </div>
    `);
    $('[data-x]')?.addEventListener('click', closeModal);
    $('#ts-save')?.addEventListener('click', async () => {
      const secretVal = $('#ts-secret').value.trim();
      // 处理 Secret 三种状态：空 = 保留原值；非空(非 __keep__) = 更新；用户显式点"清除"走其他路径
      let secretPayload = '__keep__';
      if (secretVal === '') {
        secretPayload = '__keep__'; // 空表示不改
      } else if (secretVal === '__clear__') {
        secretPayload = ''; // 显式清除（目前不用这个，占位）
      } else {
        secretPayload = secretVal;
      }
      const body = {
        turnstile_mode: $('#ts-m').value,
        turnstile_threshold: Number($('#ts-th').value) || 0,
        turnstile_sitekey_override: $('#ts-sko').value.trim(),
        turnstile_secret: secretPayload,
      };
      await api('/api/admin/settings', { method:'PUT', body: JSON.stringify(body) });
      closeModal();
      toast(t('saved'));
      loadSettings();
    });
  });

  // Turnstile 重置访问计数
  $('#ts-reset')?.addEventListener('click', async () => {

    await api('/api/admin/turnstile/visits', { method:'DELETE' });
    toast(t('tsVisitsReset'));
  });

  // ═══════════════════════════════════
  // OAuth2 Provider CRUD (Modal)
  // ═══════════════════════════════════

  const PROVIDER_PRESETS = {
    github:   { name:'GitHub',    defaultScope:'user:email' },
    google:   { name:'Google',    defaultScope:'openid email profile' },
    microsoft:{ name:'Microsoft', defaultScope:'openid email profile User.Read' },
    discord:  { name:'Discord',   defaultScope:'identify email' },
    custom:   { name:'Custom',    defaultScope:'openid email profile' },
  };
  function openOauthProviderModal(row){
    // row = null 表示新建，否则是已有数据
    const editing = !!row;
    const preset = PROVIDER_PRESETS[row?.provider_type || 'github'];
    openModal(`
      <h3>${esc(editing ? t('oauthEditTitle') : t('oauthAddTitle'))}</h3>
      <div class="sub">${esc(t('oauthGroupD'))}</div>
      <div class="field" style="margin-top:14px">
        <label>${esc(t('oauthLabel'))}</label>
        <input type="text" id="op-label" value="${esc(row?.label || preset.name)}" placeholder="${esc(t('oauthLabel'))}" style="width:100%">
      </div>
      <div class="field">
        <label>${esc(t('oauthProvider'))}</label>
        <select id="op-type" style="width:100%">
          <option value="github" ${row?.provider_type==='github'?'selected':''} style="color:#111">GitHub</option>
          <option value="google" ${row?.provider_type==='google'?'selected':''} style="color:#111">Google</option>
          <option value="microsoft" ${row?.provider_type==='microsoft'?'selected':''} style="color:#111">Microsoft</option>
          <option value="discord" ${row?.provider_type==='discord'?'selected':''} style="color:#111">Discord</option>
          <option value="custom" ${row?.provider_type==='custom'?'selected':''} style="color:#111">Custom / ${esc(t('custom'))}</option>
        </select>
      </div>
      <div class="field">
        <label>${esc(t('oauthClientId'))}</label>
        <input type="text" id="op-cid" value="${esc(row?.client_id || '')}" placeholder="${esc(t('oauthClientId'))}" style="width:100%;font-family:ui-monospace,'SF Mono',monospace">
      </div>
      <div class="field">
        <label>${esc(t('oauthClientSecret'))}</label>
        <input type="password" id="op-secret" value="" placeholder="${row?.secret_configured ? esc(t('oauthKeepSecret')) : esc(t('oauthClientSecret'))}" style="width:100%;font-family:ui-monospace,'SF Mono',monospace">
        <div class="tip">${esc(t('oauthClientSecretHelp'))}</div>
      </div>
      <div class="field">
        <label>${esc(t('oauthScope'))}</label>
        <input type="text" id="op-scope" value="${esc(row?.scope || preset.defaultScope)}" style="width:100%">
      </div>
      <div id="op-custom-block" style="display:${row?.provider_type==='custom'?'block':'none'}">
        <div class="field">
          <label>${esc(t('oauthCustomAuthorize'))}</label>
          <input type="text" id="op-au" value="${esc(row?.custom_authorize_url || '')}" style="width:100%;font-family:ui-monospace,'SF Mono',monospace">
        </div>
        <div class="field">
          <label>${esc(t('oauthCustomToken'))}</label>
          <input type="text" id="op-tu" value="${esc(row?.custom_token_url || '')}" style="width:100%;font-family:ui-monospace,'SF Mono',monospace">
        </div>
        <div class="field">
          <label>${esc(t('oauthCustomUserinfo'))}</label>
          <input type="text" id="op-ui" value="${esc(row?.custom_userinfo_url || '')}" style="width:100%;font-family:ui-monospace,'SF Mono',monospace">
        </div>
        <div class="field">
          <label>${esc(t('oauthCustomTokenField'))}</label>
          <input type="text" id="oauth-ctf" value="${esc(row?.custom_token_field || 'access_token')}" style="width:100%;font-family:ui-monospace,'SF Mono',monospace">
        </div>
      </div>
      <div class="field" style="margin-top:8px">
        <div style="font-size:12px;color:var(--text-3);line-height:1.6">
          ${esc(t('oauthCallbackUrl'))}:<br>
          <input type="text" readonly value="${esc(window.location.origin)}/oauth/callback" style="width:100%;margin-top:4px;padding:8px 12px;border-radius:10px;font-size:12px;color:#2563eb;background:#f3f5f9;border:1px solid var(--stroke);outline:none;font-family:ui-monospace,'SF Mono',monospace" onclick="this.select()">
          <div style="margin-top:4px">${esc(t('oauthCallbackHint'))}</div>
        </div>
      </div>
      <div class="actions" style="margin-top:18px">
        <button class="btn" data-x>${esc(t('cancel'))}</button>
        <button class="btn primary" id="op-save">${esc(t('save'))}</button>
      </div>
    `);
    // Provider type 切换 → 显示/隐藏 Custom 块
    $('#op-type')?.addEventListener('change', () => {
      $('#op-custom-block').style.display = $('#op-type').value === 'custom' ? 'block' : 'none';
      const preset = PROVIDER_PRESETS[$('#op-type').value];
      if (preset && $('#op-scope')?.value === '') $('#op-scope').value = preset.defaultScope;
    });
    $('[data-x]')?.addEventListener('click', closeModal);
    $('#op-save')?.addEventListener('click', async () => {
      const body = {
        label: $('#op-label').value.trim(),
        provider_type: $('#op-type').value,
        client_id: $('#op-cid').value.trim(),
        scope: $('#op-scope').value.trim(),
        enabled: row?.enabled !== false, // 默认启用
      };
      const secret = $('#op-secret').value.trim();
      if (secret) body.client_secret = secret; // 非空则更新
      else if (row?.secret_configured) body.client_secret = '__keep__'; // 编辑且未改密码 → 保留
      else body.client_secret = ''; // 新建没填 → 空字符串不加密
      if ($('#op-type').value === 'custom') {
        body.custom_authorize_url = $('#op-au').value.trim();
        body.custom_token_url = $('#op-tu').value.trim();
        body.custom_userinfo_url = $('#op-ui').value.trim();
        body.custom_token_field = $('#oauth-ctf').value.trim() || 'access_token';
      }
      try {
        if (editing) {
          await api(`/api/admin/oauth/providers/${row.id}`, { method:'PUT', body: JSON.stringify(body) });
        } else {
          await api('/api/admin/oauth/providers', { method:'POST', body: JSON.stringify(body) });
        }
        closeModal();
        toast(t('saved'));
        loadSettings();
      } catch(err){ toast(err.message, 'err'); }
    });
  }

  // 添加 Provider
  $('#oauth-add')?.addEventListener('click', () => openOauthProviderModal(null));

  // 列表里的按钮 —— 事件委托
  $('#oauth-providers-grid')?.addEventListener('click', async (e) => {
    const cfgBtn = e.target.closest('[data-oauth-config]');
    const tglBtn = e.target.closest('[data-oauth-toggle]');
    const delBtn = e.target.closest('[data-oauth-delete]');
    if (!cfgBtn && !tglBtn && !delBtn) return;
    const id = (cfgBtn || tglBtn || delBtn).dataset.oauthConfig || (cfgBtn || tglBtn || delBtn).dataset.oauthToggle || (cfgBtn || tglBtn || delBtn).dataset.oauthDelete;
    if (!id) return;

    if (cfgBtn) {
      // 先拉一次完整数据再打开 Modal
      const list = await api('/api/admin/oauth/providers');
      const row = list.providers.find(p => p.id === id);
      if (row) openOauthProviderModal(row);
    } else if (tglBtn) {
      await api(`/api/admin/oauth/providers/${id}/toggle`, { method:'POST' });
      loadSettings();
    } else if (delBtn) {
      if (!(await confirmDialog(t('confirmDeleteTitle'), t('confirmOAuthDeleteD'), false))) return;
      await api(`/api/admin/oauth/providers/${id}`, { method:'DELETE' });
      loadSettings();
    }
  });

  // 2FA Setup
  $('#twofa-setup')?.addEventListener('click', async () => {
    const adminKey = await promptAdminKey();
    if(!adminKey) return;
    try{
      const r = await api('/api/admin/2fa/setup', { method:'POST', body: JSON.stringify({ admin_key: adminKey }) });
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(r.uri)}`;
      openModal(`
        <h3>${esc(t('twofaSetupT'))}</h3>
        <div class="sub">${esc(t('twofaSetupD1'))}</div>
        <div style="text-align:center;margin:10px 0 8px">
          <img src="${qrUrl}" style="width:200px;height:200px;border-radius:12px;background:#fff;padding:10px">
        </div>
        <div style="margin:10px 0;font-size:13px">
          <div style="color:var(--text-3);margin-bottom:4px">${esc(t('twofaSetupKey'))}:</div>
          <input readonly value="${esc(r.secret)}" style="width:100%;padding:10px 12px;border-radius:10px;font-family:ui-monospace,'SF Mono',monospace;font-size:13px;color:#2563eb;background:#f3f5f9;border:1px solid var(--stroke)" onclick="this.select()">
        </div>
        <div class="field" style="margin:12px 0">
          <input type="text" id="2fa-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="${esc(t('twofaSetupCodePh'))}" style="text-align:center;letter-spacing:.4em;font-size:18px">
        </div>
        <div class="actions">
          <button class="btn" data-x>${esc(t('cancel'))}</button>
          <button class="btn primary" id="2fa-enable">${esc(t('confirm'))}</button>
        </div>
      `);
      $('[data-x]').onclick = closeModal;
      $('#2fa-enable').onclick = async () => {
        const code = $('#2fa-code').value.trim();
        if(!/^\d{6}$/.test(code)) return;
        try{
          const en = await api('/api/admin/2fa/enable', { method:'POST', body: JSON.stringify({ admin_key: adminKey, code, secret: r.secret }) });
          closeModal();
          // 展示恢复码
          showRecoveryCodes(en.recovery_codes);
        }catch(err){ toast(err.message, 'err'); }
      };
    }catch(err){ toast(err.message, 'err'); }
  });

  // ── 2FA Disable ──
  $('#twofa-disable')?.addEventListener('click', async () => {
    if(!(await confirmDialog(t('twofaDisableT'), t('twofaDisableD'), true))) return;
    const adminKey = await promptAdminKey();
    if(!adminKey) return;
    try{
      await api('/api/admin/2fa/disable', { method:'POST', body: JSON.stringify({ admin_key: adminKey }) });
      toast(t('twofaSetupT').includes('开启') ? '2FA 已关闭' : '2FA disabled');
      loadSettings();
    }catch(err){ toast(err.message, 'err'); }
  });

  // ── 2FA Regen Recovery ──
  $('#twofa-regen')?.addEventListener('click', async () => {
    if(!(await confirmDialog(t('twofaRegenT'), t('twofaRegenD'), false))) return;
    const adminKey = await promptAdminKey();
    if(!adminKey) return;
    try{
      const r = await api('/api/admin/2fa/regen-recovery', { method:'POST', body: JSON.stringify({ admin_key: adminKey }) });
      showRecoveryCodes(r.recovery_codes);
    }catch(err){ toast(err.message, 'err'); }
  });
}

function promptAdminKey(){
  return new Promise(resolve => {
    openModal(`
      <h3>${esc(t('twofaAdminKeyPh'))}</h3>
      <form id="pk-form"><input type="password" id="pk-input" autofocus placeholder="${esc(t('keyPlaceholder'))}" style="text-align:center"></form>
      <div class="actions" style="margin-top:16px">
        <button class="btn" data-x>${esc(t('cancel'))}</button>
        <button class="btn primary" id="pk-ok">${esc(t('confirm'))}</button>
      </div>
    `);
    $('[data-x]').onclick = () => { closeModal(); resolve(null); };
    $('#pk-ok').onclick = () => { const v = $('#pk-input').value.trim(); closeModal(); resolve(v || null); };
    $('#pk-form').onsubmit = e => { e.preventDefault(); $('#pk-ok').click(); };
    setTimeout(() => $('#pk-input').focus(), 50);
  });
}

function showRecoveryCodes(codes){
  openModal(`
    <h3>✅ ${esc(t('twofaSetupDone'))}</h3>
    <div class="sub">${esc(t('twofaSetupRecoveryT'))}</div>
    <div style="margin:10px 0">
      <div class="banner" style="border-radius:14px;padding:12px 16px">
        <div class="ic">⚠️</div>
        <div class="t" style="color:#b45309;font-size:13px">${esc(t('twofaSetupRecoveryD'))}</div>
      </div>
      <div style="background:rgba(245,158,11,.08);border-radius:12px;padding:16px;font-family:ui-monospace,'SF Mono',monospace;font-size:14px;color:#b45309;line-height:1.8">
        ${codes.map(c => `<div>${esc(c)}</div>`).join('')}
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="rc-copy">${esc(t('copy'))}</button>
      <button class="btn primary" data-x>${esc(t('close'))}</button>
    </div>
  `);
  $('#rc-copy').onclick = () => copyText(codes.join('\n')).then(() => toast(t('twofaSetupRecoveryCopied')));
  $('[data-x]').onclick = () => { closeModal(); loadSettings(); };
}

/* ═══════════ 启动 ═══════════ */
(async () => {
  try{
    const s = await api('/api/admin/session');
    siteTitle = s.site_title || siteTitle;
    showApp();
  }catch{
    // api() 内部已对 401 调用 showLogin() 并 throw，这里静默兜底即可
    // 若 api() 因其他错误 throw，也不渲染空页面
    if (!document.querySelector('#login-view')) showLogin();
  }
})();
</script>
</body>
</html>
